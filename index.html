<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>¿Quieres ir al cine conmigo? ❤️</title>

<style>
body{
    margin:0;
    font-family:Arial, Helvetica, sans-serif;
    background:linear-gradient(135deg,#ffdde1,#ee9ca7);
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
    overflow:hidden;
}

.caja{
    background:white;
    padding:40px;
    border-radius:20px;
    text-align:center;
    width:500px;
    box-shadow:0 10px 25px rgba(0,0,0,.2);
}

h1{
    color:#ff4b6e;
}

p{
    font-size:20px;
    color:#444;
}

img{
    width:220px;
    border-radius:15px;
    margin:20px 0;
}

.botones{
    position:relative;
    height:150px;
}

button{
    padding:15px 30px;
    font-size:18px;
    border:none;
    border-radius:12px;
    cursor:pointer;
    transition:.3s;
}

#si{
    background:#ff4b6e;
    color:white;
    margin-right:20px;
}

#si:hover{
    transform:scale(1.08);
}

#no{
    background:#666;
    color:white;
    position:absolute;
}

#talvez{
    background:#ffc107;
    color:black;
}

</style>
</head>

<body>

<div class="caja">

<h1>❤️ Invitación Especial ❤️</h1>

<img src="https://i.pinimg.com/736x/78/05/a5/7805a5b3ccb71636d512cd5ee3fc37e7.jpg"
     alt="Toy Story 5"
     width="250">

<p>
Hola mi Cosi ❤️<br><br>

Quiero invitarte a ver <b>Toy Story 5</b> conmigo.
,
comemos palomitas 🍿 .
</p>

<h2>¿Aceptas ir al cine conmigo? ❤️</h2>

<div class="botones">
<button id="si">Sí, acepto ❤️</button>

<button id="no">No quiero 😢</button>

<button id="talvez" style="margin-left:20px;">Tal vez 🤔</button>
</div>

</div>

<script>

let contador = 0;
const botonNo = document.getElementById("no");

botonNo.addEventListener("mouseover", mover);

function mover(){

    if(contador < 5){

        contador++;

        const ancho = window.innerWidth - 150;
        const alto = window.innerHeight - 100;

        const x = Math.random() * ancho;
        const y = Math.random() * alto;

        botonNo.style.left = x + "px";
        botonNo.style.top = y + "px";

    }

}

document.getElementById("si").onclick=function(){

    document.body.innerHTML=`
    <div style="
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
    background:linear-gradient(135deg,#ffdde1,#ee9ca7);
    font-family:Arial;
    text-align:center;">

    <div style="
    background:white;
    padding:40px;
    border-radius:20px;
    box-shadow:0 10px 20px rgba(0,0,0,.2);">

    <h1 style="color:#ff4b6e;">¡¡Sabía que dirías que sí!! ❤️🥰</h1>

    <h2>🍿 Nos vemos para disfrutar Toy Story 5 🎬</h2>

    <p>
    Prometo comprar las palomitas 🍿,<br>
    <br>
    y ver una de mis peliculas favoritas. ❤️
    </p>

    </div>

    </div>
    `;
}

document.getElementById("talvez").onclick=function(){

    alert("Piénsalo... no seas malucaaaaaa ❤️🥹");

}

</script>

</body>
</html>
